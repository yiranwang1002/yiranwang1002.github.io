<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>多时区时钟</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>多时区时钟 ⏰</h1>
    <!-- 顶部固定时钟 -->
    <div class="clock-card">
        <div>多伦多 (America/Toronto)</div>
        <div class="mini-date" id="torontoDate">--</div>
        <div class="time" id="torontoTime">--:--:--</div>
    </div>
    <div class="clock-card">
        <div>北京时间 (Asia/Shanghai)</div>
        <div class="mini-date" id="beijingDate">--</div>
        <div class="time" id="beijingTime">--:--:--</div>
    </div>

    <!-- 批量换算区域 -->
    <div class="panel">
        <h3>任意时区时间换算（批量）</h3>
        <p class="desc">选择起点城市/搜索城市，添加多个目标城市，一键批量换算；卡片时钟实时走动</p>
        <div class="source-row">
            <select id="sourceCitySelect"></select>
            <input type="text" id="sourceSearchCity" placeholder="🔍输入城市，回车搜索">
            <input type="date" id="sourceDate" value="2026/09/30">
            <input type="time" id="sourceTime" value="14:28">
        </div>
        <div id="targetList"></div>
        <div class="btn-row">
            <button id="addTargetBtn">+增加目标城市（最多10个）</button>
            <button id="calcBtn">批量换算 →</button>
        </div>
        <div id="resultBox" class="result-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
