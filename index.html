<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>多时区时钟</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>多时区时钟</h1>

    <div class="clock-card">
        <h2>多伦多 (UTC−4)</h2>
        <div class="time-text" id="torontoTime">--:--:--</div>
    </div>
    <div class="clock-card">
        <h2>北京时间 (UTC+8)</h2>
        <div class="time-text" id="beijingTime">--:--:--</div>
    </div>


    <div class="clock-card">
        <h2>任意时区时间换算（批量）</h2>
        <p class="hint">选择起点城市+时间，添加多个目标城市，一键批量换算</p>
        <div class="row">
            <select id="sourceCity">
                <option value="-4">多伦多</option>
                <option value="8">北京</option>
                <option value="0">伦敦</option>
                <option value="-5">纽约</option>
                <option value="9">东京</option>
            </select>
            <input type="date" id="sourceDate">
            <input type="time" id="sourceTime">
        </div>

        <!-- ✅ 关键：目标列表容器，JS新增行就插在这里！之前就是缺这个 -->
        <div id="targetList" class="row"></div>

        <div class="row">
            <button id="addTargetBtn">+增加目标城市（最多10个）</button>
            <button id="calcBtn">批量换算 →</button>
        </div>

        <div class="result-row" id="resultBox"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
