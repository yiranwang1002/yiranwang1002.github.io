<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>多时区时钟</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>多时区时钟</h1>

    <!-- 原有实时时钟区域 完全保留 -->
    <div class="clock-card">
      <h2>多伦多 (UTC-4)</h2>
      <p id="toronto-time" class="time-text">--:--:--</p>
    </div>
    <div class="clock-card">
      <h2>北京时间 (UTC+8)</h2>
      <p id="beijing-time" class="time-text">--:--:--</p>
    </div>

    <!-- ✨ 增强版：批量多时区换算器 -->
    <div class="clock-card">
      <h2>任意时区时间换算（批量）</h2>
      <p class="hint">选择起点城市+时间，添加多个目标城市，一键批量换算</p>
      <div class="row">
        <select id="city-from">
          <option value="America/Toronto">多伦多</option>
          <option value="Asia/Shanghai">北京</option>
          <option value="Europe/London">伦敦</option>
          <option value="America/New_York">纽约</option>
          <option value="Europe/Paris">巴黎</option>
          <option value="Asia/Tokyo">东京</option>
          <option value="Australia/Sydney">悉尼</option>
        </select>
        <input type="date" id="input-date">
        <input type="time" id="input-time">
      </div>

      <div id="target-list">
        <!-- 这里动态生成多个目标时区选择框 -->
        <div class="row target-row">
          <span>换算到：</span>
          <select class="city-to">
            <option value="America/Toronto">多伦多</option>
            <option value="Asia/Shanghai">北京</option>
            <option value="Europe/London">伦敦</option>
            <option value="America/New_York">纽约</option>
            <option value="Europe/Paris">巴黎</option>
            <option value="Asia/Tokyo">东京</option>
            <option value="Australia/Sydney">悉尼</option>
          </select>
          <button type="button" onclick="removeTarget(this)">删除</button>
        </div>
      </div>

      <div class="row" style="margin-top:12px;">
        <button onclick="addTarget()">+增加目标城市（最多10个）</button>
        <button onclick="batchConvert()">批量换算 →</button>
      </div>

      <!-- 批量换算结果时钟行，横向排列 -->
      <div id="result-row" class="result-row">
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
